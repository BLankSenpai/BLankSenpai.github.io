<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Physics Sketchpad | Matthew Calogrides</title>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || new URLSearchParams(location.search).get('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {}
    </script>
    <style>
        html, body { margin: 0; padding: 0; background: #ffffff; }
        html.dark-mode, html.dark-mode body { background: #141416; }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle .icon-moon { display: none; }
        html.dark-mode .theme-toggle .icon-sun { display: none; }
        html.dark-mode .theme-toggle .icon-moon { display: block; }
    </style>
    <link rel="stylesheet" type="text/css" href="physics.css?v=20261114f">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Portfolio</span>
        </a>
        <div class="header-brand">&lt;Physics Sketchpad&gt;</div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="6.34" y1="17.66" x2="4.93" y2="19.07"></line>
                <line x1="19.07" y1="4.93" x2="17.66" y2="6.34"></line>
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <main class="workspace">
        <section class="toolbar" aria-label="Drawing and physics controls">
            <div class="tool-group color-group">
                <span class="tool-label">Color</span>
                <div class="swatches" role="radiogroup" aria-label="Preset drawing colors">
                    <button type="button" class="swatch active" data-color="#2563eb" style="--swatch-color: #2563eb;" aria-label="Cobalt Blue" aria-checked="true"></button>
                    <button type="button" class="swatch" data-color="#dc2626" style="--swatch-color: #dc2626;" aria-label="Crimson Red" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#16a34a" style="--swatch-color: #16a34a;" aria-label="Emerald Green" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#d97706" style="--swatch-color: #d97706;" aria-label="Amber Gold" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#7c3aed" style="--swatch-color: #7c3aed;" aria-label="Violet Purple" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#db2777" style="--swatch-color: #db2777;" aria-label="Rose Pink" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#0d9488" style="--swatch-color: #0d9488;" aria-label="Teal" aria-checked="false"></button>
                    <button type="button" class="swatch" data-color="#3f3f46" style="--swatch-color: #3f3f46;" aria-label="Charcoal" aria-checked="false"></button>
                </div>
                <label class="custom-color-wrap" title="Pick custom color">
                    <input type="color" id="colorPicker" value="#2563eb" aria-label="Custom color picker">
                    <span class="custom-color-Preview" id="customColorRing"></span>
                </label>
            </div>

            <div class="tool-divider" aria-hidden="true"></div>

            <div class="tool-group size-group">
                <span class="tool-label">Stroke</span>
                <div class="size-pills" role="radiogroup" aria-label="Brush thickness">
                    <button type="button" class="size-pill" data-size="8" aria-label="Thin stroke">
                        <span class="dot" style="width: 6px; height: 6px;"></span>
                    </button>
                    <button type="button" class="size-pill active" data-size="14" aria-label="Medium stroke">
                        <span class="dot" style="width: 10px; height: 10px;"></span>
                    </button>
                    <button type="button" class="size-pill" data-size="22" aria-label="Thick stroke">
                        <span class="dot" style="width: 14px; height: 14px;"></span>
                    </button>
                </div>
            </div>

            <div class="tool-divider" aria-hidden="true"></div>

            <div class="tool-group actions-group">
                <button type="button" id="gravityBtn" class="action-btn" title="Cycle gravity mode">
                    Gravity: Normal
                </button>
                <button type="button" id="undoBtn" class="action-btn" title="Remove last drawn object">
                    Undo
                </button>
                <button type="button" id="clearBtn" class="action-btn danger-btn" title="Clear all objects">
                    Clear Field
                </button>
            </div>
        </section>

        <section class="field-stage" id="fieldStage">
            <canvas id="physicsCanvas"></canvas>
            <div class="field-overlay" id="fieldOverlay" aria-hidden="true">
                <p class="overlay-title">Draw anywhere to create a physics object</p>
                <p class="overlay-sub">Release to drop &middot; Click or tap any object and drag to launch it</p>
            </div>
            <div class="field-status" aria-live="polite">
                <span id="objectCount">0 objects</span>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="copyright">&copy;2023 Matthew Calogrides</p>
    </footer>

    <script src="physics.js?v=20261114f"></script>
</body>
</html>
