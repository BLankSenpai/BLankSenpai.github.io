<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kanban Board | Matthew Calogrides</title>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || new URLSearchParams(location.search).get('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {}
    </script>
    <style>
        html, body { margin: 0; padding: 0; background: #ffffff; }
        html.dark-mode, html.dark-mode body { background: #141416; }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle .icon-moon { display: none; }
        html.dark-mode .theme-toggle .icon-sun { display: none; }
        html.dark-mode .theme-toggle .icon-moon { display: block; }
    </style>
    <link rel="stylesheet" type="text/css" href="kanban.css?v=20261114f">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Portfolio</span>
        </a>
        <div class="header-brand">&lt;Kanban Board&gt;</div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="6.34" y1="17.66" x2="4.93" y2="19.07"></line>
                <line x1="19.07" y1="4.93" x2="17.66" y2="6.34"></line>
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <main class="container">

        <section class="board-controls">
            <div class="board-intro">
                <h1 class="board-title">Task Board</h1>
                <p class="board-subtitle">Minimalist workflow across three stages. Drag cards or use arrows to move tasks.</p>
            </div>

            <form id="addTaskForm" class="add-task-form">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                    maxlength="140"
                    autocomplete="off"
                >
                <select id="columnSelect" aria-label="Target column">
                    <option value="do">Do</option>
                    <option value="doing">Doing</option>
                    <option value="done">Done</option>
                </select>
                <button type="submit" class="primary-btn">Add Task</button>
            </form>

            <div class="board-actions">
                <button type="button" id="clearDoneBtn" class="util-btn">Clear Done</button>
                <button type="button" id="resetBoardBtn" class="util-btn">Reset Demo</button>
            </div>
        </section>

        <section class="kanban-board" aria-label="Kanban Board">

            <div class="kanban-column" data-column="do">
                <div class="column-header">
                    <h2>Do</h2>
                    <span class="count-pill" id="count-do">0</span>
                </div>
                <div class="card-list" id="list-do" data-column="do"></div>
            </div>

            <div class="kanban-column" data-column="doing">
                <div class="column-header">
                    <h2>Doing</h2>
                    <span class="count-pill" id="count-doing">0</span>
                </div>
                <div class="card-list" id="list-doing" data-column="doing"></div>
            </div>

            <div class="kanban-column" data-column="done">
                <div class="column-header">
                    <h2>Done</h2>
                    <span class="count-pill" id="count-done">0</span>
                </div>
                <div class="card-list" id="list-done" data-column="done"></div>
            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy;2023 Matthew Calogrides</p>
    </footer>

    <script src="kanban.js?v=20261114d"></script>
</body>
</html>
